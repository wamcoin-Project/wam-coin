# ===========================================================================
#  Build and publish a WAM Coin release.
#
#  Pushing a tag is the whole trigger. GitHub builds the binaries on its own
#  machines and publishes them itself, using a token it issues to this job and
#  destroys when the job ends. No release token exists on anyone's laptop, and
#  nobody has to remember to drag files into a browser -- which is exactly how
#  the first release came to be announced without existing.
#
#      git tag -a v0.1.0 -m 'first testnet release'
#      git push origin v0.1.0
#
#  The build recipe is not written here. It is install.sh, the same script a
#  user runs, so the published binaries cannot drift from the documented build.
#  A second recipe in this file would be correct on the day it was written and
#  wrong the first time install.sh changed.
# ===========================================================================

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.1.0). Builds but does not publish.'
        required: true

permissions:
  contents: write        # required to create the release; nothing else is granted

jobs:
  build:
    # 22.04 on purpose, not ubuntu-latest. A binary linked against a newer
    # glibc will not start on an older one, so building on the oldest release
    # we support is what makes the tarball run on both 22.04 and 24.04.
    # `latest` silently becomes a newer distro one day and quietly drops
    # everyone still on 22.04.
    runs-on: ubuntu-22.04
    # 180 was right while this configured against apt packages that were
    # already installed. depends builds boost, libevent, sqlite and -- for the
    # wallet -- Qt from source before Core is compiled at all, which is the
    # price of a tarball that carries its own libraries. Qt is the long pole
    # and can take an hour on its own.
    #
    # Raised rather than discovered: a release that dies at minute 180 wastes
    # the whole build and says nothing useful about why. 330 leaves room under
    # the 360 ceiling for hosted runners. If this ever becomes the slow part
    # worth fixing, depends/built is cacheable by HOST and package versions --
    # which is a real optimisation and not something to attempt during a
    # release.
    timeout-minutes: 330

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # package_release.sh reports the commit it built

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: The tag must match the version the binary will report
        run: |
          set -euo pipefail
          # v0.1.1 was tagged, built, published and verified -- and the binary
          # inside announced itself as /WAM:0.1.0/ to every peer, because the
          # version lives in the source and nothing compared the two. A release
          # whose name disagrees with the software in it is the same class of
          # fault as a node on the wrong chain: everything looks right until
          # someone tries to tell two builds apart.
          tag="${{ steps.v.outputs.version }}"
          src="$(python3 -c "
          import re, pathlib
          t = pathlib.Path('scripts/patch_upstream.py').read_text(encoding='utf-8')
          m = re.search(r'^WAM_CLIENT_VERSION\s*=\s*\"([^\"]+)\"', t, re.M)
          print(m.group(1) if m else '')
          ")"
          echo "tag=$tag  source=$src"
          [ -n "$src" ] || { echo "::error::WAM_CLIENT_VERSION not found in scripts/patch_upstream.py"; exit 1; }
          if [ "${tag#v}" != "$src" ]; then
            echo "::error::tag $tag does not match WAM_CLIENT_VERSION $src -- raise the version in the commit you tag"
            exit 1
          fi

      # THE SAME SCRIPT A USER RUNS IS THE WRONG SCRIPT FOR A RELEASE.
      #
      # This step was `install.sh --build-only --node-only`, and the comment
      # here said "the same script a user runs" as though that were a virtue.
      # It is, for a user: install.sh pulls build dependencies from apt and
      # configures against them, which is exactly right for compiling WAM for
      # the computer in front of you. It is wrong for producing a file for
      # strangers, because the result then demands the build machine's
      # libraries from every machine that runs it.
      #
      # It shipped that way, for every Linux release this project has made.
      # On 2026-10-18, one day after v0.1.12, Jeeves downloaded the node onto
      # Ubuntu 26 and got a loader error for libevent-2.1.so.7. Debian and
      # Ubuntu split libevent into four packages and a stock image installs
      # libevent_core alone, so the library our binaries asked for is absent
      # on an ordinary desktop. It reproduces on a clean Ubuntu 24.04.
      #
      # Windows and macOS never had this: both go through upstream's depends,
      # which builds boost, libevent and sqlite and links them in. Linux was
      # the only platform with no release build of its own. It has one now.
      - name: Dependencies for depends
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Upstream's depends/README.md for Linux, plus bison for Qt.
          # patchelf: the wallet carries the X11 libraries depends builds as
          # shared objects, and they are found through an RPATH relative to
          # the binary. See scripts/lib/shared_deps.sh.
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake autoconf automake libtool pkg-config \
              curl patch python3 xz-utils bison patchelf

      - name: Fetch and patch Bitcoin Core
        run: bash scripts/fetch-upstream.sh

      # WAM_WITH_GUI=1 asks depends for Qt as well, so the wallet carries its
      # toolkit the way the Windows and macOS wallets already do.
      #
      # The wallet still cannot hold the node's release hostage -- that was a
      # deliberate property of this workflow and it was not given up, it moved.
      # build_linux.sh builds Qt FIRST, because it is the slow and fragile
      # half, and on failure says so loudly and carries on with a node-only
      # build. So there is one configure and one make instead of two, and a Qt
      # problem still costs the wallet rather than the release.
      - name: Build the node and the wallet, carrying their libraries
        run: WAM_WITH_GUI=1 bash scripts/build_linux.sh

      # THE WALLET USED TO BE A STEP OF ITS OWN HERE, and the reasoning that
      # put it there is kept because it is still true and still governs:
      #
      #   install.sh configured with --without-gui, so package_release.sh
      #   looked for src/qt/wam-qt, never found one, and wrote "no GUI in this
      #   build" into a log nobody read -- the whole wallet path had never run
      #   once since it was written. Windows and macOS grew a wallet on
      #   2026-09-26 and 09-27, and shipping without this would have put a
      #   wallet on the two platforms this project owns no machine of and none
      #   on the one every server here runs. It was continue-on-error,
      #   deliberately, because v0.1.11 carried a fix for a defect that loses
      #   a solo miner about two blocks in three and the wallet was not
      #   allowed to hold that hostage.
      #
      # It was folded into the build step above on 2026-10-18. It had to be:
      # build_qt.sh reconfigures this same tree with no config.site, so it
      # silently relinked the node against the runner's own libraries after
      # the node had been built -- which is why wamd and wam-qt shipped with
      # the identical set of missing libraries. Two configures over one tree,
      # where the second quietly undid the first.
      #
      # Nothing is hidden if Qt fails: build_linux.sh warns, builds the node
      # anyway, package_release.sh says "no GUI in this build", SHA256SUMS
      # lists no wallet and the notes offer none. build_qt.sh itself stays
      # for developers, as CONTRIBUTING.md documents; it is simply no longer
      # the path a release takes.

      - name: Package
        run: bash scripts/package_release.sh --version "${{ steps.v.outputs.version }}"

      - name: Verify the artifact before anyone can download it
        run: |
          set -euo pipefail
          cd out/release
          ls -la

          # A checksum file that does not match its own tarballs is worse than
          # none: it tells people a corrupt download is fine.
          sha256sum -c SHA256SUMS

          # Unpack somewhere with nothing built in it and confirm the binary
          # actually runs. A tarball that builds but does not start is the
          # failure this whole job exists to prevent.
          work="$(mktemp -d)"
          tar -xzf wam-coin-*.tar.gz -C "$work"
          node_bin="$(find "$work" -name wamd -type f | head -1)"
          [ -n "$node_bin" ] || { echo "::error::no wamd in the tarball"; exit 1; }
          chmod +x "$node_bin"
          "$node_bin" -version | head -3

          # Compare the shared libraries against a recorded list, not a count
          # with room in it. A ceiling of "no more than eight" passes a build
          # that swapped one library for another, and passes three new ones the
          # day a legitimate one is dropped -- which is how a check ends up
          # green while the thing it guards is broken.
          #
          # Any difference in either direction is a failure. Something added is
          # a dependency that crept back in; something missing means a feature
          # was silently compiled out, and the wallet disappearing is not a
          # smaller problem than Kerberos reappearing.
          # RE-PINNED FOR v0.1.13, AND THE REMOVALS ARE THE POINT.
          #
          # This list held libevent-2.1.so.7, libevent_core, libevent_pthreads
          # and libsqlite3.so.0 -- correctly, because the binary really did ask
          # a stranger's machine for them, and a clean Ubuntu does not have the
          # first of those. That is the loader error Jeeves got on 18 October,
          # one day after v0.1.12 was published.
          #
          # build_linux.sh links them from depends now, so they are gone, and
          # the pin fired on their going: "the shared library set changed",
          # with four minus signs and nothing added. Exactly what it is for --
          # this check refuses a change in EITHER direction, because a library
          # disappearing can mean a feature was silently compiled out, and that
          # is not a smaller problem than one creeping in.
          #
          # What is left is the C library and its companions, which is the
          # whole requirement now. Anything that joins this list again is a
          # dependency that came back, and it will have to be put here by hand
          # with a reason beside it.
          cat > /tmp/expected-libs <<'LIBS'
          libc.so.6
          libgcc_s.so.1
          libm.so.6
          libstdc++.so.6
          LIBS
          sed -i 's/^ *//' /tmp/expected-libs

          ldd "$node_bin" | awk '/=>/ {print $1}' | sort -u > /tmp/actual-libs
          echo "linked against:"; sed 's/^/  /' /tmp/actual-libs

          if ! diff -u /tmp/expected-libs /tmp/actual-libs > /tmp/libdiff; then
            echo "::error::the shared library set changed (- expected, + actual)"
            cat /tmp/libdiff
            exit 1
          fi

          # And confirm it starts on 22.04 rather than only linking correctly.
          # package_release.sh already gates the symbol versions, but that runs
          # on the build machine; this is the binary as a downloader gets it.
          "$node_bin" -version >/dev/null 2>/tmp/starterr || {
            echo "::error::the packaged wamd does not start here"
            cat /tmp/starterr; exit 1
          }

      # --check, which hashes NOTHING, asked of the tarball a stranger
      # downloads rather than of a build tree.
      #
      # This step mined two regtest blocks when it was added on 2026-09-24,
      # and the account was suspended within the hour: the repository, every
      # release download back to v0.1.8, raw.githubusercontent.com and
      # wamcoin.org all returned 404 to the public, on a release day. The
      # chain was worthless and the intent was a correctness proof; neither is
      # visible to an abuse detector, and GitHub's terms forbid mining on
      # their runners whatever the chain is worth.
      #
      # Hashing and submission are proved by test_platform_solo.sh, on
      # hardware this project owns.
      - name: The packaged miner builds a block the packaged node accepts
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          for a in out/release/wam-coin-*.tar.gz out/release/wam-miner-*.tar.gz; do
            tar -xzf "$a" -C "$work"
          done
          mkdir -p "$work/bin"
          for n in wamd wam-cli wam-miner; do
            f="$(find "$work" -name "$n" -type f | head -1)"
            [ -n "$f" ] || { echo "::error::no $n in the release archives"; exit 1; }
            cp "$f" "$work/bin/"
          done
          chmod +x "$work/bin"/*
          bash scripts/test/test_platform_check.sh "$work/bin"

      # ON A MACHINE THAT NEVER BUILT IT, WHICH IS THE ONLY KIND THAT COUNTS.
      #
      # The step above unpacks the published archives and runs them -- and it
      # passed for every release that could not start, because it runs on the
      # builder. The builder has libevent, sqlite and Qt installed; that is
      # how it built them. Testing a binary on the machine that compiled it
      # proves it compiled.
      #
      # So the same archives are run again here with nothing installed. The
      # container gets no apt-get, deliberately: the moment anything is
      # installed to make this pass, it has stopped being the test. Ubuntu
      # 24.04 and Debian 12 are two different library layouts, and Jeeves was
      # on Ubuntu 26 -- newer than the runner, which is the ordinary case for
      # a user and was never once exercised before today.
      - name: Run the published archives where nothing is installed
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 debian:12; do
            echo "::group::$image"
            docker run --rm -v "$PWD/out/release:/rel:ro" "$image" bash -s <<'SANDBOX'
          set -euo pipefail
          work=$(mktemp -d)
          for a in /rel/wam-coin-*.tar.gz /rel/wam-miner-*.tar.gz /rel/wam-qt-*.tar.gz; do
            [ -e "$a" ] || continue
            tar -xzf "$a" -C "$work"
          done
          found=0
          for n in wamd wam-cli wam-miner wam-qt; do
            f=$(find "$work" -name "$n" -type f -perm -u+x | head -1)
            [ -n "$f" ] || continue
            found=$((found+1))
            # -version is answered before Qt starts, so the wallet needs no
            # display. offscreen is set anyway rather than relied upon.
            if QT_QPA_PLATFORM=offscreen "$f" -version >/dev/null 2>&1 \
               || QT_QPA_PLATFORM=offscreen "$f" --version >/dev/null 2>&1; then
              echo "  ok    $n starts"
            else
              echo "  FAIL  $n does not start here:"
              QT_QPA_PLATFORM=offscreen "$f" -version 2>&1 | head -3 | sed 's/^/        /'
              exit 1
            fi
          done
          [ "$found" -gt 0 ] || { echo "  no binary was found to run -- not a pass"; exit 1; }
          echo "  $found binaries start with nothing installed"
          SANDBOX
            echo "::endgroup::"
          done

      - name: Publish the release
        if: steps.v.outputs.publish == 'yes'
        env:
          # Issued by GitHub for this run and revoked when it ends. It is not a
          # personal token and cannot be reused anywhere else.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          # Everything below 1.0 is a pre-release, and says so on the page,
          # rather than depending on whoever cut it to remember the checkbox.
          prerelease=""
          case "$VERSION" in v0.*) prerelease="--prerelease" ;; esac

          # A consensus-changing release must not be announced in the same
          # voice as any other. v0.1.5 moved the mainnet treasury address, and
          # a node left behind will reject every valid block and fork itself
          # off at height 1 -- silently. It keeps running and mining, alone.
          #
          # The announcement bot cannot know that unless it is told, so the
          # tag says it. Write a line in the annotated tag message:
          #
          #     MANDATORY: <one line saying why>
          #
          # and it is copied to the top of the release notes, where the bot
          # finds it and announces the release as UPDATE REQUIRED instead of
          # as news. Leaving it to somebody to remember to post a warning by
          # hand means the day they forget is the day it matters.
          # ---- the notes come from the annotated tag, and from nowhere else
          #
          # `git tag -l --format='%(contents)'` returns the COMMIT message when
          # refs/tags/<v> is a lightweight ref rather than a tag object, and it
          # returns it silently. Nothing in the output says which one you got,
          # and a runner is exactly where that ref ends up lightweight.
          #
          # On 5 September v0.1.7 was published carrying commit 702d540's
          # message as its release notes. The tag said "This release is NOT
          # mandatory. No consensus rule changed." The commit carried a
          # paragraph explaining this very convention, word-wrapped so that
          # `MANDATORY:` happened to start a line. The hoist below found it,
          # the announcer quoted the notes, and every channel was told that a
          # release which changes nothing was UPDATE REQUIRED -- spending, on a
          # release that needed no action, the one warning that has to be
          # believed on launch day.
          #
          # git cat-file refuses on anything that is not a tag object, so the
          # substitution cannot happen quietly a second time.
          git fetch --force --tags --quiet origin 2>/dev/null || true
          if [ "$(git cat-file -t "$VERSION" 2>/dev/null || echo none)" != "tag" ]; then
            echo "::error::refs/tags/$VERSION is not an annotated tag object on this runner."
            echo "The release notes would be taken from the commit message instead of"
            echo "the tag, silently. Re-push the tag:"
            echo
            echo "    git push --force origin $VERSION"
            exit 1
          fi
          tagmsg="$(git cat-file tag "$VERSION" | sed '1,/^$/d' \
                    | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')"

          # A MANDATORY line counts only where the convention puts it: the
          # first non-empty line under the title. Anywhere else it is prose
          # that mentions the convention -- which is what fired it in v0.1.7 --
          # and prose about a rule must not be able to invoke the rule.
          first="$(printf '%s\n' "$tagmsg" | tail -n +2 \
                   | grep -m1 -v '^[[:space:]]*$' || true)"
          mandatory=""
          if printf '%s' "$first" | grep -qiE '^[[:space:]]*MANDATORY:'; then
            mandatory="$first"
          fi

          # A release that changes a consensus rule has to say so, and the
          # only thing that ever checked was somebody's memory.
          #
          # v0.1.5 moved the mainnet treasury address -- the one consensus
          # change this project has made since genesis -- and was published
          # with no MANDATORY line at all. Every mechanism built for that
          # case sat idle: the release notes did not carry the warning, the
          # bot announced it as ordinary news, and two independent operators
          # stayed on v0.1.4 for two days.
          #
          # consensus_floor.py derives, from the tags themselves, which
          # release last changed a consensus value. If that release is this
          # one, the tag must declare it.
          floor="$(python3 scripts/consensus_floor.py 2>/dev/null || true)"
          if [ "$floor" = "$VERSION" ] && [ -z "$mandatory" ]; then
            echo "::error::$VERSION changes a consensus value and its tag has no MANDATORY: line."
            echo "Nodes on any earlier release will reject every valid block and fork off,"
            echo "and nothing will tell them. Re-tag with a line reading:"
            echo
            echo "    MANDATORY: <one line saying what changed and what happens if you do not update>"
            echo
            python3 scripts/consensus_floor.py --explain || true
            exit 1
          fi

          # And the other direction, which is the one that went wrong.
          #
          # A MANDATORY line on a release that changes no consensus value is
          # how the warning stops being believed. The channels are told UPDATE
          # REQUIRED for something needing no update, operators upgrade in a
          # hurry for nothing, and the next notice -- the real one -- reads
          # like the last false one. A warning that cries wolf is worse than
          # no warning, because it was the thing standing between an operator
          # and a silent fork.
          #
          # Two independent sources have to agree before either voice is used:
          # the tag, written by hand, and consensus_floor.py, derived from the
          # tags themselves. When they disagree one of them is wrong and a
          # person has to look.
          if [ "$floor" != "$VERSION" ] && [ -n "$mandatory" ]; then
            echo "::error::$VERSION declares MANDATORY but changes no consensus value."
            echo
            echo "  the tag declares         : $mandatory"
            echo "  last consensus change was: ${floor:-none since genesis}"
            echo
            echo "Either the line does not belong in this tag, or consensus_floor.py"
            echo "cannot see a change that is really there. One of the two has to be"
            echo "corrected before this release is announced to anybody."
            python3 scripts/consensus_floor.py --explain || true
            exit 1
          fi

          # The rest of the tag message is the release note.
          #
          # It was thrown away until v0.1.6, which was tagged with a full
          # account of the bug it fixed -- which miners were affected, what
          # the symptom looked like, what to do -- and published with nothing
          # but the boilerplate below. The announcement bot quotes the release
          # body, so the channels carried a version number and a checksum
          # command and no reason for anyone to act.
          #
          # An annotated tag is where that explanation belongs: it is written
          # at the moment the release is cut, by whoever cut it, and it is
          # signed into the repository rather than typed into a web form
          # afterwards. Line 1 is the title, which gh already shows, and the
          # MANDATORY line is hoisted above -- both are dropped here so
          # nothing is printed twice.
          #
          # Only the hoisted line is dropped, and only its first occurrence.
          # The old form filtered EVERY line matching MANDATORY:, so a tag
          # that quoted the convention lost that sentence out of the middle of
          # its own explanation -- which is how v0.1.7's notes came to read
          # "whether the tag message needs a" followed by "on v0.1.4 forks
          # itself off at height 1". A release note is the last thing that
          # should be edited by a regular expression it never asked for.
          body="$(printf '%s\n' "$tagmsg" | tail -n +2)"
          if [ -n "$mandatory" ]; then
            body="$(printf '%s\n' "$body" \
                    | awk -v m="$mandatory" '!d && $0 == m { d = 1; next } { print }')"
          fi

          # THE ACCOUNT IN THESE TWO LINES WAS SUSPENDED ON 24 SEPTEMBER.
          #
          # Thirty-two files were corrected that day and this was not one of
          # them, because no check read workflow files. So the draft notes for
          # v0.1.11 told every reader to fetch SHA256SUMS, SHA256SUMS.asc,
          # verify_release.sh and SIGNING-KEY.asc from a 404 -- in the one
          # block whose entire purpose is to let somebody who does not trust
          # us check the download for himself. A reader following it would
          # conclude the release cannot be verified.
          #
          # These stay on GitHub rather than moving to wamcoin.org for one
          # reason: the notes themselves are served from here. If this host is
          # gone, the page carrying these commands is gone with it, so pointing
          # them elsewhere buys nothing -- while pointing them here means they
          # work the instant the release is published, before the site has
          # been redeployed. The trust anchor was never the host anyway: it is
          # the fingerprint in SECURITY.md, which verify_release.sh compares.
          #
          # scripts/check_channels.py now reads every workflow and fails if a
          # name CHANNELS.txt disowns appears in one at all.
          BASE="https://github.com/wamcoin-Project/wam-coin/releases"
          RAW="https://raw.githubusercontent.com/wamcoin-Project/wam-coin/main"
          notes="$(mktemp)"
          {
            if [ -n "$mandatory" ]; then
              echo "$mandatory"
              echo
            fi
            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$body"
              echo
              echo "---"
              echo
            fi
            echo "Built by GitHub Actions from \`${GITHUB_SHA}\` on ubuntu-22.04."
            echo
            # Not `sha256sum -c SHA256SUMS`, which was here until v0.1.7.
            #
            # A checksum file hosted beside the file it describes proves only
            # that both came from the same place: whoever can replace the
            # binary replaces the list too, and the two agree perfectly. It
            # catches a corrupted download. It does not catch anybody.
            #
            # Every other page in this project says so -- it is the first
            # paragraph of verify_release.sh -- while the release page itself,
            # the one place a stranger definitely reads, told them to run the
            # check that proves nothing.
            echo "Verify before running:"
            echo
            echo '```'
            # The download step is part of the instruction.
            #
            # Without it an outside tester followed exactly what this prints,
            # in an empty directory, and got "SHA256SUMS is not here" -- with
            # nothing wrong on his side. Whoever wrote these two lines already
            # had the files in front of him.
            # No clone.
            #
            # The clone form assumed the repository sat beside the downloads.
            # An outside tester's was at /root/wam-coin while his downloads
            # were in /root/Downloads, so the last line could not find the
            # script -- and when he wiped and started again, the clone went
            # with it and the instruction broke a second way. Twenty megabytes
            # fetched to run one file, and a directory layout nobody stated.
            #
            # Five downloads and one command, in whatever directory the reader
            # is standing in. It is no weaker: cloning took the script and the
            # key from the same origin these two do, and the trust anchor was
            # never the transport -- it is the fingerprint in SECURITY.md,
            # which the script compares and which the reader is told to check
            # over HTTPS.
            echo "curl -LO $BASE/download/$VERSION/SHA256SUMS"
            echo "curl -LO $BASE/download/$VERSION/SHA256SUMS.asc"
            echo "curl -LO $RAW/scripts/verify_release.sh"
            echo "curl -LO $RAW/SIGNING-KEY.asc"
            echo "bash verify_release.sh ."
            echo '```'
            echo
            # "This is testnet software" was true when it was written and
            # stopped being true on 15 September 2026, when mainnet started.
            # Left standing it tells a reader the coins are not real, on the
            # release page of a chain that has been producing real blocks for
            # a fortnight -- which is a false statement about the one thing a
            # reader most needs to be right about.
            echo "WAM has no market value and may never have one. Mainnet has been"
            echo "running since 15 September 2026, and this is young software: two"
            echo "independent developers have reviewed it and their findings were"
            echo "adopted; no security firm has audited it."
            echo
            echo "Build it yourself instead, if you prefer -- the release above is"
            echo "produced by \`install.sh --build-only\`, the same script in this"
            echo "repository, with no manual steps."
          } > "$notes"

          # gh is preinstalled on GitHub runners. Using it rather than a
          # third-party publishing action keeps the number of people who can
          # change what gets attached to a release at zero.
          #
          # --draft, and it is the whole point of this block.
          #
          # This runner cannot sign anything. The signing key is offline, on a
          # USB stick, and package_release.sh signs only when that key is on
          # the machine -- which on a GitHub runner it never is. So without
          # --draft every release went public unsigned and stayed that way
          # until a person noticed, downloaded SHA256SUMS, signed it and
          # uploaded SHA256SUMS.asc by hand.
          #
          # For the length of that window, anyone following our own
          # instructions got:
          #
          #     FAIL  SHA256SUMS.asc is not here -- that file IS the proof.
          #           A release without it cannot be checked.
          #           Do not run the binaries.
          #
          # which is exactly right, and exactly the thing we spent 5 September
          # making sure a stranger would never see about a good release. How
          # long that window lasted for v0.1.6 is not known, because nothing
          # measured it.
          #
          # A draft is not downloadable and does not appear on the releases
          # page. It becomes visible only when a human publishes it, which is
          # the same person who has just uploaded the signature. So an
          # unsigned public release stops being possible rather than stopping
          # being likely.
          #
          # After the workflow finishes:
          #
          #     gh release download v0.1.7 -p SHA256SUMS
          #     gpg --detach-sign --armor SHA256SUMS      # the offline key
          #     gh release upload v0.1.7 SHA256SUMS.asc
          #     gh release edit v0.1.7 --draft=false
          #
          # docs/RELEASING.md carries this with the reasoning.
          gh release create "$VERSION" \
            --title "WAM Coin $VERSION" \
            --notes-file "$notes" \
            --draft \
            $prerelease \
            out/release/*.tar.gz \
            out/release/SHA256SUMS

          echo
          echo "::notice::$VERSION is a DRAFT. It is not downloadable by anyone"
          echo "::notice::until it is signed and published. See docs/RELEASING.md"

      # KEEP THE LOGS WHEN IT FAILS, WHICH IS THE ONLY TIME THEY MATTER.
      #
      # build_linux.sh writes depends-linux.log, configure-linux.log and
      # make-linux.log, and its own failure messages tell the reader to grep
      # them. On 2026-10-29 a run died thirty-three minutes in, at the very
      # last gate, saying
      #
      #     Check that depends really produced .../share/config.site and that
      #     configure used it:
      #       grep -i 'boost|event|sqlite' .../build/configure-linux.log
      #
      # and every one of those files went with the runner. A message that
      # points at evidence nobody can reach is the same fault as a check that
      # reports nothing: the next step is another thirty-three minutes, spent
      # finding out what this run already knew.
      #
      # if: failure() and not always(): a green build's logs are forty
      # megabytes of nothing.
      - name: Keep the build logs when it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ steps.v.outputs.version }}
          path: |
            build/*.log
            build/wam-core/config.log
          retention-days: 14
          if-no-files-found: warn

      - name: Keep the artifact even when this was only a test build
        if: steps.v.outputs.publish != 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: wam-coin-${{ steps.v.outputs.version }}
          path: out/release/
          retention-days: 14
