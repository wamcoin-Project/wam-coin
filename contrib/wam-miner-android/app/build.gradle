plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.vslabs.wam_miner'
    compileSdk 33

    // Note: Removed the manual jniLibs.srcDirs since CMake will automatically
    // compile and bundle your native libraries into the APK for you.
    sourceSets {
        main {
            // Keep this block only if you have OTHER pre-built .so files
            // that you aren't compiling from source code.
        }
    }

    defaultConfig {
        applicationId "org.vslabs.wam_miner"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 1. ADD THIS: Configure native compiler arguments
        externalNativeBuild {
            cmake {
                // Highly recommended optimizations for an application like a miner
                cppFlags "-std=c++17 -O3 -flto"
                arguments "-DANDROID_STL=c++_shared"
                arguments "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_BUILD_TYPE=Release"
            }
        }

        ndk {
            abiFilters "arm64-v8a"//, "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Forces system code optimization properties inside target packaging schemas
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // 2. ADD THIS: Instruct Gradle where your CMake project configuration file lives
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            // NDK 28 works well with modern CMake versions (3.22.1+ is standard in recent SDKs)
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
//    ndkVersion '28.0.13004108'
//      ndkVersion '25.2.9519653'
//    ndkVersion '21.4.7075529'
//    ndkVersion '23.1.7779620'
    ndkVersion libs.versions.ndkVersionTarget.get()
}


dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.cardview

    // Core Gson serialization engine
    implementation 'com.google.code.gson:gson:2.14.0'
}
